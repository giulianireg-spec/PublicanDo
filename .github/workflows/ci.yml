# CI de la app: chequeo de tipos, bundle de Android y escaneo de secretos.
name: CI

on:
  push:
    branches: [main, 'feature/**']
  pull_request:
    branches: [main]

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  check:
    name: Tipos y bundle
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
      - run: npm ci
      - name: Chequeo de tipos
        run: npx tsc --noEmit
      - name: Bundle de Android (detecta errores de imports y de Metro)
        run: npx expo export --platform android --output-dir /tmp/expo-export

  secrets:
    name: Escaneo de secretos (gitleaks)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Instalar gitleaks
        run: curl -sSfL https://github.com/gitleaks/gitleaks/releases/download/v8.30.1/gitleaks_8.30.1_linux_x64.tar.gz | tar -xz -C /usr/local/bin gitleaks
      # Usa .gitleaks.toml y .gitleaksignore de la raíz del repo, si existen
      - name: Buscar secretos en el historial
        run: gitleaks git . --redact --verbose
