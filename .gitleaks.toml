# Configuración de gitleaks para el CI.
[extend]
useDefault = true

[[allowlists]]
description = "Claves públicas de cliente: viajan dentro de la app (EXPO_PUBLIC_*, google-services.json y la clave de Google Maps de app.json) y están restringidas en Google Cloud a GuianDo"
regexTarget = "line"
regexes = ['''EXPO_PUBLIC_[A-Z_]+''', '''"current_key"''', '''"apiKey": "AIza''']
